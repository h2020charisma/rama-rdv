meta:
    extract_upstream: False

tasks:
  - source: tdparse.py
    upstream: []
    name: tdparse-[[dataset]]
    product:
      nb: products/tdparse_import/[[dataset]].ipynb
      nexus: products/tdparse_import/tdparse-[[dataset]].nxs
    params:
      config: "{{config}}"
    grid:
      dataset: ["ATR_FTIR", "Raman", "PIFM"]


