      solr_index: "products/tdparse_import/solr_json"
      plots: "products/tdparse_import/images"
      #ambit_json: "products/{{hsds_investigation}}_ambit.json"
    params:
      domain: "POLYRISK"
      # nexus_folder2import: "D:\\nina\\DATA\\charisma\\OCEAN_POLYMERS\\nexus"            
      # nexus_folder2import: "D:\\nina\\DATA\\charisma\\ocean\\nexus"  
      baseline_remove: False                